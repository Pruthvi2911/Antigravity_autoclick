name: Validate extension
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v6
        with:
          name: antigravity-option2-vsix
          path: dist/*.vsix
